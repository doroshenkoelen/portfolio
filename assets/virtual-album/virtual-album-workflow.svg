<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0e1830"/>
      <stop offset="1" stop-color="#050b16"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#182640" stroke-width="1"/>
    </pattern>
    <style>
      .kicker{font:700 18px Menlo,Consolas,monospace;letter-spacing:4px;fill:#00d8ff}
      .title{font:700 46px Inter,Arial,sans-serif;fill:#f7fbff}
      .h2{font:700 27px Inter,Arial,sans-serif;fill:#f7fbff}
      .body{font:500 19px Inter,Arial,sans-serif;fill:#a8b4ca}
      .small{font:600 15px Inter,Arial,sans-serif;fill:#a8b4ca}
      .mono{font:700 15px Menlo,Consolas,monospace;letter-spacing:2px;fill:#00d8ff}
      .button{font:700 13px Inter,Arial,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.45"/>
  
  <text class="kicker" x="72" y="90">HOW IT WORKS</text>
  <text class="title" x="72" y="154">From real photograph to AR album page</text>
  <text class="body" x="72" y="206">The app keeps the camera view live, anchors a 3D album on a detected surface, then converts prints, camera shots, or library images into saved virtual pages.</text>
  <rect x="88" y="310" width="198" height="250" rx="12" fill="#0b1528" stroke="#213456" stroke-width="1.4"/>
      <circle cx="140" cy="362" r="28" fill="#06101e" stroke="#00d8ff" stroke-width="3"/>
      <text x="140" y="371" text-anchor="middle" font-family="Inter,Arial" font-weight="800" font-size="24" fill="#00d8ff">1</text>
      <text class="h2" x="116" y="430">Find flat surface</text>
      <text class="small" x="116" y="474">ARKit plane detection scans the real table or floor.</text>
      <path d="M294 438 H326" stroke="#00d8ff" stroke-width="3" stroke-linecap="round"/><rect x="333" y="310" width="198" height="250" rx="12" fill="#0b1528" stroke="#213456" stroke-width="1.4"/>
      <circle cx="385" cy="362" r="28" fill="#06101e" stroke="#00d8ff" stroke-width="3"/>
      <text x="385" y="371" text-anchor="middle" font-family="Inter,Arial" font-weight="800" font-size="24" fill="#00d8ff">2</text>
      <text class="h2" x="361" y="430">Place AR album</text>
      <text class="small" x="361" y="474">Tap outside the UI to anchor the volumetric book.</text>
      <path d="M539 438 H571" stroke="#00d8ff" stroke-width="3" stroke-linecap="round"/><rect x="578" y="310" width="198" height="250" rx="12" fill="#0b1528" stroke="#213456" stroke-width="1.4"/>
      <circle cx="630" cy="362" r="28" fill="#06101e" stroke="#00d8ff" stroke-width="3"/>
      <text x="630" y="371" text-anchor="middle" font-family="Inter,Arial" font-weight="800" font-size="24" fill="#00d8ff">3</text>
      <text class="h2" x="606" y="430">Choose input</text>
      <text class="small" x="606" y="474">ADD PHOTO, TAKE PHOTO, or LIBRARY starts capture.</text>
      <path d="M784 438 H816" stroke="#00d8ff" stroke-width="3" stroke-linecap="round"/><rect x="823" y="310" width="198" height="250" rx="12" fill="#0b1528" stroke="#213456" stroke-width="1.4"/>
      <circle cx="875" cy="362" r="28" fill="#06101e" stroke="#00d8ff" stroke-width="3"/>
      <text x="875" y="371" text-anchor="middle" font-family="Inter,Arial" font-weight="800" font-size="24" fill="#00d8ff">4</text>
      <text class="h2" x="851" y="430">Detect or import</text>
      <text class="small" x="851" y="474">The scanner scores paper-like regions and edges.</text>
      <path d="M1029 438 H1061" stroke="#00d8ff" stroke-width="3" stroke-linecap="round"/><rect x="1068" y="310" width="198" height="250" rx="12" fill="#0b1528" stroke="#213456" stroke-width="1.4"/>
      <circle cx="1120" cy="362" r="28" fill="#06101e" stroke="#00d8ff" stroke-width="3"/>
      <text x="1120" y="371" text-anchor="middle" font-family="Inter,Arial" font-weight="800" font-size="24" fill="#00d8ff">5</text>
      <text class="h2" x="1096" y="430">Save to page</text>
      <text class="small" x="1096" y="474">Wide images fill one page; tall images share a page.</text>
      <path d="M1274 438 H1306" stroke="#00d8ff" stroke-width="3" stroke-linecap="round"/><rect x="1313" y="310" width="198" height="250" rx="12" fill="#0b1528" stroke="#213456" stroke-width="1.4"/>
      <circle cx="1365" cy="362" r="28" fill="#06101e" stroke="#00d8ff" stroke-width="3"/>
      <text x="1365" y="371" text-anchor="middle" font-family="Inter,Arial" font-weight="800" font-size="24" fill="#00d8ff">6</text>
      <text class="h2" x="1341" y="430">Navigate later</text>
      <text class="small" x="1341" y="474">PREV/NEXT, DEL, EMPTY, NEW, and DRIVE manage albums.</text>
      
  <rect x="168" y="650" width="1264" height="118" rx="12" fill="#08101e" stroke="#213456"/>
  <text class="mono" x="204" y="694">INTERACTION LOOP</text>
  <text class="body" x="204" y="734">real world camera feed + virtual album anchor + UI buttons + saved photo manifest in persistent app storage</text>

</svg>
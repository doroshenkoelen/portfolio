<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0e1830"/>
      <stop offset="1" stop-color="#050b16"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#182640" stroke-width="1"/>
    </pattern>
    <style>
      .kicker{font:700 18px Menlo,Consolas,monospace;letter-spacing:4px;fill:#00d8ff}
      .title{font:700 46px Inter,Arial,sans-serif;fill:#f7fbff}
      .h2{font:700 27px Inter,Arial,sans-serif;fill:#f7fbff}
      .body{font:500 19px Inter,Arial,sans-serif;fill:#a8b4ca}
      .small{font:600 15px Inter,Arial,sans-serif;fill:#a8b4ca}
      .mono{font:700 15px Menlo,Consolas,monospace;letter-spacing:2px;fill:#00d8ff}
      .button{font:700 13px Inter,Arial,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.45"/>
  
  <text class="kicker" x="72" y="96">PROJECT 05 · UNITY AR · IPHONE · COMPUTER VISION</text>
  <text class="title" x="72" y="160">Virtual AR Photo Album</text>
  <text class="body" x="72" y="210">A mobile AR album that places a volumetric photo book in the real world, scans physical prints, crops them, and saves them as persistent album pages.</text>
  <rect x="72" y="280" width="1456" height="540" rx="16" fill="#0b1528" stroke="#213456" stroke-width="1.4"/>
  <rect x="72" y="280" width="1456" height="540" rx="16" fill="#0b1220"/>
  <rect x="72" y="280" width="1456" height="540" rx="16" fill="url(#grid)" opacity="0.38"/>
  <circle cx="1220" cy="420" r="150" fill="#00d8ff" opacity="0.08"/>
  <g filter="url(#shadow)">
    <rect x="960" y="330" width="280" height="430" rx="36" fill="#05070c" stroke="#22334f" stroke-width="2"/>
    <rect x="974" y="364" width="252" height="362" rx="20" fill="#172033"/>
    <rect x="1048" y="342" width="104" height="18" rx="9" fill="#000"/>
  </g>
  <path d="M1099 546 L760 620" stroke="#00d8ff" stroke-width="4" stroke-dasharray="10 10" opacity="0.75"/>
  <g filter="url(#shadow)"><polygon points="430,528.6 779.5999999999999,480.3 827.9,708 473.7,763.2" fill="#d93d3a" stroke="#ff9d8e" stroke-width="2.5"/>
       <polygon points="473.7,763.2 827.9,708 816.4,747.0999999999999 462.2,800" fill="#efece1"/>
       <rect x="585.25" y="581.5" width="101.19999999999999" height="80.5" rx="5" fill="#f7fbff" opacity="0.96"/>
       <text x="625.5" y="696.5" text-anchor="middle" font-family="Inter,Arial" font-weight="700" font-size="23" fill="#fff">Album name</text>
    <polygon points="409.3,535.5 448.4,528.6 492.1,763.2 453,772.4" fill="#8f2736" opacity="0.92"/>
    <path d="M455.3 558.5 C480.6 599.9, 485.2 713.75, 456.45 758.5999999999999" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="8.049999999999999"/>
  </g>
  <rect x="150" y="360" width="300" height="64" rx="8" fill="#070d18" opacity="0.82"/>
  <text class="mono" x="174" y="387">AR PLANE FOUND</text>
  <text class="small" x="174" y="412">tap the real table to anchor the album</text>
  <rect x="970" y="700" width="270" height="42" rx="4" fill="#0b0b0b" opacity="0.9"/>
  <text class="button" x="1105" y="726" text-anchor="middle">ADD PHOTO</text>
  <rect x="72" y="860" width="450" height="92" rx="10" fill="#0b1528" stroke="#213456" stroke-width="1.4"/>
  <text class="mono" x="102" y="894">3 INPUT MODES</text>
  <text class="body" x="102" y="925">scan print · camera · library</text>
  <rect x="575" y="860" width="450" height="92" rx="10" fill="#0b1528" stroke="#213456" stroke-width="1.4"/>
  <text class="mono" x="605" y="894">PERSISTENT ALBUM</text>
  <text class="body" x="605" y="925">local saves + Drive-ready backup</text>
  <rect x="1078" y="860" width="450" height="92" rx="10" fill="#0b1528" stroke="#213456" stroke-width="1.4"/>
  <text class="mono" x="1108" y="894">REAL 3D BOOK</text>
  <text class="body" x="1108" y="925">cover, pages, spine, and photo slots</text>

</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0e1830"/>
      <stop offset="1" stop-color="#050b16"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#182640" stroke-width="1"/>
    </pattern>
    <style>
      .kicker{font:700 18px Menlo,Consolas,monospace;letter-spacing:4px;fill:#00d8ff}
      .title{font:700 46px Inter,Arial,sans-serif;fill:#f7fbff}
      .h2{font:700 27px Inter,Arial,sans-serif;fill:#f7fbff}
      .body{font:500 19px Inter,Arial,sans-serif;fill:#a8b4ca}
      .small{font:600 15px Inter,Arial,sans-serif;fill:#a8b4ca}
      .mono{font:700 15px Menlo,Consolas,monospace;letter-spacing:2px;fill:#00d8ff}
      .button{font:700 13px Inter,Arial,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.45"/>
  
  <text class="kicker" x="72" y="90">ALBUM CUSTOMIZATION AND STORAGE</text>
  <text class="title" x="72" y="154">A virtual book that behaves like a real album</text>
  <text class="body" x="72" y="205">The user can name the album, choose a pastel cover, add a cover photo, turn pages, repair photo orientation, delete mistakes, start a new album, and prepare a Google Drive backup.</text>
  <rect x="92" y="290" width="430" height="520" rx="14" fill="#0b1528" stroke="#213456" stroke-width="1.4"/>
  <text class="mono" x="126" y="336">COVER VIEW</text>
  <g filter="url(#shadow)"><polygon points="156,444.48 405.28,410.04 439.71999999999997,572.4 187.16,611.76" fill="#d93d3a" stroke="#ff9d8e" stroke-width="2.5"/>
       <polygon points="187.16,611.76 439.71999999999997,572.4 431.52,600.28 178.96,638" fill="#efece1"/>
       <rect x="266.7" y="482.2" width="72.16" height="57.4" rx="5" fill="#f7fbff" opacity="0.96"/>
       <text x="295.4" y="564.2" text-anchor="middle" font-family="Inter,Arial" font-weight="700" font-size="16.4" fill="#fff">Album name</text>
    <polygon points="141.24,449.4 169.12,444.48 200.28,611.76 172.4,618.3199999999999" fill="#8f2736" opacity="0.92"/>
    <path d="M174.04 465.8 C192.07999999999998 495.32, 195.36 576.5, 174.86 608.48" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="5.739999999999999"/>
  </g>
  <rect x="126" y="690" width="64" height="34" fill="#d93d3a"/>
  <rect x="202" y="690" width="64" height="34" fill="#c9dfc7"/>
  <rect x="278" y="690" width="64" height="34" fill="#b6d3e5"/>
  <rect x="354" y="690" width="64" height="34" fill="#c9b6dc"/>
  <text class="small" x="126" y="762">cover color, cover image, and album title are user-editable</text>
  <rect x="586" y="290" width="430" height="520" rx="14" fill="#0b1528" stroke="#213456" stroke-width="1.4"/>
  <text class="mono" x="620" y="336">PAGE LAYOUTS</text>
  <g filter="url(#shadow)"><polygon points="650,470 889.4,435 918.8,591.6 681.92,623.52" fill="#eef1e7" stroke="#d8ddce" stroke-width="3"/>
       <polygon points="602.96,463.92 650,457.2 681.92,623.52 629,631.92" fill="#b6d3e5" stroke="#ff9d8e" stroke-width="2"/>
       <rect x="695.36" y="478.2" width="88.2" height="126" rx="4" fill="#fff"/>
       <rect x="796.16" y="477.36" width="94.08" height="126" rx="4" fill="#fff"/>
    <polygon points="634.88,448.8 663.44,443.76 695.36,615.12 666.8,621.84" fill="#8f2736" opacity="0.92"/>
    <path d="M668.48 465.6 C686.96 495.84, 690.32 579, 669.32 611.76" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="5.88"/>
  </g>
  <rect x="668" y="690" width="128" height="74" fill="#fff"/>
  <text class="small" x="815" y="716">wide photo: one per page</text>
  <rect x="668" y="780" width="58" height="88" fill="#fff"/>
  <rect x="740" y="780" width="58" height="88" fill="#fff"/>
  <text class="small" x="815" y="818">tall photos: two per page</text>
  <rect x="1080" y="290" width="430" height="520" rx="14" fill="#0b1528" stroke="#213456" stroke-width="1.4"/>
  <text class="mono" x="1114" y="336">SAVE AND BACKUP</text>
  <rect x="1130" y="392" width="310" height="96" rx="10" fill="#101c31" stroke="#213456"/>
  <text class="h2" x="1160" y="432">Local persistence</text>
  <text class="small" x="1160" y="462">JPG files + JSON manifest in app storage</text>
  <rect x="1130" y="520" width="310" height="96" rx="10" fill="#101c31" stroke="#213456"/>
  <text class="h2" x="1160" y="560">New album archive</text>
  <text class="small" x="1160" y="590">previous content saved before reset</text>
  <rect x="1130" y="648" width="310" height="96" rx="10" fill="#101c31" stroke="#213456"/>
  <text class="h2" x="1160" y="688">Google Drive folder</text>
  <text class="small" x="1160" y="718">OAuth setup required before upload</text>

</svg>
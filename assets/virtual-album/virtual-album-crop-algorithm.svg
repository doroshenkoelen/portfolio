<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0e1830"/>
      <stop offset="1" stop-color="#050b16"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#182640" stroke-width="1"/>
    </pattern>
    <style>
      .kicker{font:700 18px Menlo,Consolas,monospace;letter-spacing:4px;fill:#00d8ff}
      .title{font:700 46px Inter,Arial,sans-serif;fill:#f7fbff}
      .h2{font:700 27px Inter,Arial,sans-serif;fill:#f7fbff}
      .body{font:500 19px Inter,Arial,sans-serif;fill:#a8b4ca}
      .small{font:600 15px Inter,Arial,sans-serif;fill:#a8b4ca}
      .mono{font:700 15px Menlo,Consolas,monospace;letter-spacing:2px;fill:#00d8ff}
      .button{font:700 13px Inter,Arial,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.45"/>
  
  <text class="kicker" x="72" y="90">PHOTO IDENTIFICATION AND CROP</text>
  <text class="title" x="72" y="154">A lightweight scanner for physical prints</text>
  <text class="body" x="72" y="205">ADD PHOTO does not save the whole camera view. It finds a paper-like rectangle, refines the edges,</text>
  <text class="body" x="72" y="235">crops the source image, and inserts only the detected print.</text>
  <rect x="92" y="300" width="390" height="430" rx="14" fill="#0b1528" stroke="#213456" stroke-width="1.4"/>
  <text class="mono" x="126" y="346">1 CAMERA FRAME</text>
  <rect x="126" y="380" width="320" height="250" rx="8" fill="#322a24"/>
  <rect x="190" y="432" width="188" height="126" transform="rotate(-8 284 495)" fill="#faf9ef" stroke="#ffffff" stroke-width="5"/>
  <circle cx="155" cy="590" r="34" fill="#d0a17e" opacity="0.8"/>
  <text class="small" x="126" y="676">background may include hands, table,</text>
  <text class="small" x="126" y="700">laptop, or room objects</text>
  <path d="M500 512 H590" stroke="#00d8ff" stroke-width="4" stroke-dasharray="12 10"/>
  <rect x="610" y="300" width="390" height="430" rx="14" fill="#0b1528" stroke="#213456" stroke-width="1.4"/>
  <text class="mono" x="644" y="346">2 DETECTION SCORE</text>
  <rect x="644" y="380" width="320" height="250" rx="8" fill="#101b2d"/>
  <rect x="706" y="433" width="190" height="128" transform="rotate(-8 801 497)" fill="none" stroke="#00d8ff" stroke-width="5" filter="url(#glow)"/>
  <path d="M690 452 L704 430 M910 544 L894 565 M720 586 L700 566 M880 412 L900 430" stroke="#73e9ff" stroke-width="3"/>
  <text class="small" x="644" y="676">thresholds, connected components,</text>
  <text class="small" x="644" y="700">and edge scoring choose the rectangle</text>
  <path d="M1018 512 H1108" stroke="#00d8ff" stroke-width="4" stroke-dasharray="12 10"/>
  <rect x="1128" y="300" width="390" height="430" rx="14" fill="#0b1528" stroke="#213456" stroke-width="1.4"/>
  <text class="mono" x="1162" y="346">3 SAVED PAGE</text>
  <polygon points="1194,410 1430,380 1466,604 1228,635" fill="#e9eee6" stroke="#d6ddce" stroke-width="3"/>
  <rect x="1262" y="448" width="154" height="104" transform="rotate(-8 1339 500)" fill="#fff" stroke="#eef"/>
  <rect x="1280" y="464" width="118" height="72" transform="rotate(-8 1339 500)" fill="#64b6d1"/>
  <text class="small" x="1162" y="676">cropped texture becomes a JPG</text>
  <text class="small" x="1162" y="700">and is listed in the manifest</text>

</svg>